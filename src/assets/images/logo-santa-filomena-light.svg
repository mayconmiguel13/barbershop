<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 60" width="280" height="60">
  <defs>
    <linearGradient id="gradSchool" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="gradSun" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>

  <!-- Brasão / Ícone Infantil da Santa Filomena -->
  <g transform="translate(10, 8)">
    <!-- Círculo base -->
    <rect x="0" y="0" width="44" height="44" rx="12" fill="url(#gradSchool)" />
    <!-- Sol / Criança / Estrela do Saber -->
    <circle cx="22" cy="18" r="7" fill="url(#gradSun)" />
    <!-- Arco / Asas acolhedoras / Abraço protetor -->
    <path d="M12 36 C12 28, 32 28, 32 36" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
    <!-- Letras SF elegantes -->
    <text x="22" y="22" font-family="Arial, sans-serif" font-size="9" font-weight="900" fill="#ffffff" text-anchor="middle">SF</text>
  </g>

  <!-- Textos da Marca (Fundo Escuro) -->
  <text x="65" y="27" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" fill="#ffffff" letter-spacing="0.5">CEI SANTA FILOMENA</text>
  <text x="65" y="42" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="600" fill="#93c5fd" letter-spacing="1.5">EDUCAÇÃO INFANTIL • CONTAGEM</text>
</svg>
